services:

  app:
    environment:
      APP_FQDN: ${APP_FQDN:-webstudio.localhost}
      DEPLOYMENT_URL: ${DEPLOYMENT_URL:-https://webstudio.localhost}

  local-proxy:
    image: nginx:alpine

    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    ports:
      - "127.0.0.1:443:443"

    volumes:
      - ./nginx/webstudio-local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.local/certs:/etc/nginx/certs:ro
