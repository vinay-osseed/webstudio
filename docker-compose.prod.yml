name: agns-webstudio-prod

services:
  # Optional edge stack retained for reference/alternate deployments.
  # It is disabled by default on this VPS because host Nginx already owns 80/443.
  caddy:
    profiles: ["caddy-edge"]
    image: ${CADDY_IMAGE:-caddy:2.10.2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      tls-ask:
        condition: service_started
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/prod/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  tls-ask:
    profiles: ["caddy-edge"]
    image: ${NGINX_IMAGE:-nginx:1.29-alpine}
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./deploy/prod/tls-ask.conf:/etc/nginx/conf.d/default.conf:ro

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-webstudio-assets}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
        mc mb --ignore-existing local/$$S3_BUCKET
        mc anonymous set download local/$$S3_BUCKET
        echo 'Bucket ready.'

  db:
    image: ${POSTGRES_IMAGE:-postgres:15.19-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: webstudio
    volumes:
      - db-data:/var/lib/postgresql/data
    configs:
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webstudio"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-setup:
    image: ${POSTGRES_IMAGE:-postgres:15.19-alpine}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql "postgresql://postgres:$$POSTGRES_PASSWORD@db:5432/webstudio" \
          -v ON_ERROR_STOP=1 \
          -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF; END \$\$;" \
          -c "GRANT USAGE ON SCHEMA public TO anon;" \
          -c "GRANT ALL ON ALL TABLES IN SCHEMA public TO anon;" \
          -c "GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon;" \
          -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon;" \
          -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon;"

  migrate:
    image: ${BUILDER_IMAGE:-ghcr.io/webstudio-community/builder:latest}
    restart: "no"
    depends_on:
      db-setup:
        condition: service_completed_successfully
    entrypoint:
      - /prisma/node_modules/.bin/prisma
      - migrate
      - deploy
      - --schema=/app/prisma/schema.prisma
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio

  postgrest:
    image: ${POSTGREST_IMAGE:-postgrest/postgrest:v12.2.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      TRPC_SERVER_API_TOKEN: ${TRPC_SERVER_API_TOKEN}
      PUBLISHER_HOST: ${PUBLISHER_HOST:-webstudio.agnsbroadband.in}
      SELF_HOSTED_PUBLISHER_URL: http://publisher:4000
      PGRST_DB_SCHEMAS: public

  # Self-hosted Webstudio publisher.
  # The Builder calls port 4000 internally. Nothing is exposed publicly here;
  # the public AGNS site is exported separately and hosted elsewhere.
  publisher:
    image: ${PUBLISHER_IMAGE}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TRPC_SERVER_API_TOKEN: ${TRPC_SERVER_API_TOKEN}
      PUBLISHER_HOST: ${PUBLISHER_HOST:-webstudio.agnsbroadband.in}
      BUILDER_INTERNAL_URL: http://app:3000
      PROXY_PORT: "4001"
    volumes:
      - published-sites:/var/publish
      - publisher-work:/var/work
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  app:
    image: ${BUILDER_IMAGE:-ghcr.io/webstudio-community/builder:latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      postgrest:
        condition: service_started

    # The VPS already runs host Nginx on ports 80/443.
    # Bind Builder only to loopback so it is never directly public.
    ports:
      - "127.0.0.1:3000:3000"

    # Make Webstudio's server-side OAuth callback reach host Nginx
    # without relying on public-IP hairpin NAT.
    extra_hosts:
      - "webstudio.agnsbroadband.in:host-gateway"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

    environment:
      NODE_ENV: production
      PORT: "3000"
      DEPLOYMENT_ENVIRONMENT: production
      DEPLOYMENT_URL: https://webstudio.agnsbroadband.in
      POSTGREST_URL: http://postgrest:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/webstudio
      AUTH_SECRET: ${AUTH_SECRET}
      DEV_LOGIN: ""
      DEV_LOGIN_EMAIL: ""
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GH_CLIENT_ID: ""
      GH_CLIENT_SECRET: ""
      AUTH_WS_CLIENT_ID: ${AUTH_WS_CLIENT_ID:-agns-webstudio-cli}
      AUTH_WS_CLIENT_SECRET: ${AUTH_WS_CLIENT_SECRET}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      FEATURES: ${FEATURES:-*}
      USER_PLAN: ${USER_PLAN:-Pro}
      MAX_ASSETS_PER_PROJECT: ${MAX_ASSETS_PER_PROJECT:-250}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-webstudio-assets}

    volumes:
      - uploads:/app/public/s/uploads

configs:
  postgres_init:
    content: |
      CREATE SCHEMA IF NOT EXISTS extensions;
      CREATE EXTENSION IF NOT EXISTS "uuid-ossp" SCHEMA extensions;
      ALTER DATABASE webstudio SET search_path TO "$$user", public, extensions;
      CREATE ROLE anon NOLOGIN;
      GRANT USAGE ON SCHEMA public TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon;
      ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO anon;

volumes:
  db-data:
    name: agns-webstudio-db
  uploads:
    name: agns-webstudio-uploads
  minio-data:
    name: agns-webstudio-minio
  caddy-data:
    name: agns-webstudio-caddy-data
  caddy-config:
    name: agns-webstudio-caddy-config
  published-sites:
    name: agns-webstudio-published-sites
  publisher-work:
    name: agns-webstudio-publisher-work
